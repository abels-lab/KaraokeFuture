<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karaoke Screen</title>
  <link rel="icon" href="/static/img/microphone.png">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    body.idle-cursor, body.idle-cursor * { cursor: none !important; }
    #line-main, #line-next { font-size: clamp(2.2rem, 4.6vw, 5.8rem); transition: opacity .3s; }
  </style>
</head>
<body class="tv h-full overflow-hidden antialiased">
  <!-- Song video, muted: the sound comes from the control panel -->
  <video id="video" muted playsinline preload="auto"
         class="fixed inset-0 h-full w-full object-cover opacity-0 transition-opacity duration-1000"></video>
  <div class="fixed inset-0 bg-gradient-to-t from-black/90 via-black/30 to-black/45"></div>

  <!-- Idle: nobody singing -->
  <section id="idle" class="relative flex h-full items-center justify-center gap-[6vw] px-[6vw]">
    <div class="flex flex-col items-center text-center">
      <img src="/static/img/microphone.png" alt="" class="mic-glow w-[26vw] max-w-md -rotate-6">
      <h1 class="font-display mt-6 text-[6vw] font-black leading-none text-gold" data-title>Karaoke Night</h1>
      <p class="mt-4 text-[1.8vw] text-stone-200">Scan the code, pick a song, take the stage</p>
    </div>
    <div class="panel flex flex-col items-center gap-4 p-[2vw]">
      <img id="qr" alt="QR code for the guest page" class="w-[20vw] max-w-sm rounded-2xl bg-white p-3">
      <p id="qr-url" class="font-mono text-[1.2vw] text-gold"></p>
      <div id="idle-next" class="w-full space-y-1 text-[1.2vw]"></div>
    </div>
  </section>

  <!-- Loading: songs wait, the next one is still being prepared (loading.js fills it) -->
  <section id="loading" class="relative hidden h-full items-center justify-center px-[6vw]"></section>

  <!-- Stage: a song is playing -->
  <section id="stage" class="relative hidden h-full flex-col p-[3vw]">
    <!-- Song info card: who sings, the song, who's next; shown briefly (look.js Look.infoCard) -->
    <header id="info-card" class="flex items-start justify-between gap-6 transition-opacity duration-700">
      <div class="flex min-w-0 items-center gap-4">
        <img src="/static/img/microphone.png" alt="" class="mic-glow h-[6vw] w-auto -rotate-12">
        <div class="min-w-0">
          <p class="text-[1vw] font-semibold uppercase tracking-[0.35em] text-gold">Now singing</p>
          <h2 id="singer" class="font-display truncate text-[3.4vw] font-black leading-tight"></h2>
          <p id="title" class="truncate text-[1.4vw] text-stone-200"></p>
        </div>
      </div>
      <div id="up-next" class="panel hidden max-w-[28vw] px-5 py-3 text-right">
        <p class="text-[0.9vw] font-semibold uppercase tracking-[0.3em] text-gold">Up next</p>
        <p id="up-next-singer" class="font-display truncate text-[1.8vw] font-bold"></p>
        <p id="up-next-title" class="truncate text-[1vw] text-stone-300"></p>
      </div>
    </header>

    <div data-lyrics-box class="lyric-shadow mt-auto flex flex-col items-center gap-[2.2vh] pb-[4vh] text-center">
      <p id="hint" class="min-h-[3rem] text-[2.2vw] font-bold text-gold"></p>
      <p id="line-main" class="font-extrabold leading-tight"></p>
      <p id="line-next" class="font-extrabold leading-tight"></p>
      <p id="no-lyrics" class="hidden text-[2.4vw] text-stone-200">No lyrics found — freestyle! 🎶</p>
    </div>
  </section>

  <p id="fs-tip" class="panel fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 text-sm text-stone-300 transition-opacity duration-700">
    Click anywhere or press <b>F</b> for fullscreen
  </p>
  <p id="lost" class="fixed right-4 top-4 hidden rounded-full bg-red-800/90 px-3 py-1 text-sm font-semibold">Reconnecting to the control panel…</p>

  <script src="/static/common.js"></script>
  <script src="/static/look.js"></script>
  <script src="/static/pulse.js"></script>
  <script src="/static/stage.js"></script>
  <script src="/static/mics.js"></script>
  <script src="/static/fx.js"></script>
  <script src="/static/notes.js"></script>
  <script src="/static/battle-fx.js"></script>
  <script src="/static/results.js"></script>
  <script src="/static/game-view.js"></script>
  <script src="/static/intro.js"></script>
  <script src="/static/jokes.js"></script>
  <script src="/static/loading.js"></script>
  <script src="/static/screen.js"></script>
</body>
</html>
