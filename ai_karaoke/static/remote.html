<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0705">
  <title>Karaoke Remote</title>
  <link rel="icon" href="/static/img/microphone.png">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/theme-club.css">
  <link rel="stylesheet" href="/static/theme-rock.css">
  <link rel="stylesheet" href="/static/theme-adaptive.css">
  <link rel="stylesheet" href="/static/theme-options.css">
  <link rel="stylesheet" href="/static/theme-layout.css">
  <link rel="stylesheet" href="/static/style-fx.css">
  <link rel="stylesheet" href="/static/ui/responsive.css">
  <link rel="stylesheet" href="/static/guest/layout.css">
</head>
<!-- Guest remote: one page. Views Now / Queue (guest/router.js), popups for search, settings and the DJ Co-Pilot chat. -->
<body class="antialiased view-now">
  <div id="now-bar" class="now-bar items-center gap-3"></div>
  <div class="guest-shell safe-x safe-top space-y-4">
    <header id="header" class="flex items-center gap-2">
      <img src="/static/img/microphone.png" alt="" class="mic-glow h-10 w-auto -rotate-12">
      <h1 class="font-display min-w-0 flex-1 truncate text-2xl font-black text-gold" data-title>Golden Mic Karaoke</h1>
      <button type="button" data-open="custom" class="hide-phone tap rounded-xl bg-amber-500/10 border border-amber-400/30 px-3 py-2 text-sm font-semibold text-gold hover:bg-amber-500/20" title="Upload audio file or link">📁 Load song</button>
      <button type="button" data-open="search" class="hide-phone btn-gold tap rounded-xl px-4 py-2 text-sm">＋ Find a song</button>
      <button id="btn-remote-playlists" type="button" data-open="playlists" class="hidden tap rounded-xl bg-white/10 px-3 py-2 text-sm font-semibold text-amber-300 hover:bg-white/20" title="Auto-DJ playlists (host)" aria-label="Auto-DJ playlists">📻<span class="hide-phone"> Playlists</span></button>
      <button id="btn-fullscreen" type="button" class="hide-phone tap tap-square flex items-center justify-center rounded-xl bg-white/10 px-3 py-2 hover:bg-white/20" title="Fullscreen" aria-label="Fullscreen" aria-pressed="false"></button>
      <button type="button" data-open="settings" class="hide-phone tap tap-square rounded-xl bg-white/10 px-3 py-2 text-lg hover:bg-white/20" title="Settings" aria-label="Settings">⚙</button>
    </header>

    <!-- Party login: shown until this device has a guest session (remote-login.js fills it) -->
    <form id="login" class="panel hidden space-y-3 p-4"></form>

    <main class="guest-grid">
      <!-- Now: now playing + transport, battle join, lyrics -->
      <div data-view="now" class="space-y-4">
        <section class="panel p-4">
          <div class="flex items-center justify-between gap-2">
            <p class="text-xs font-semibold uppercase tracking-[0.3em] text-gold">Now singing</p>
            <button id="np-lyrics" class="tap hidden rounded-lg bg-white/10 px-2.5 py-1 text-xs font-semibold hover:bg-white/20"></button>
          </div>
          <p id="np-singer" class="font-display mt-1 text-2xl font-bold">Nobody yet</p>
          <p id="np-title" class="text-sm text-stone-300">Add a song to get started</p>
          <div id="np-battle" class="flex flex-wrap gap-2 pt-1 empty:hidden"></div>
          <div id="np-prefs"></div>
          <div class="mt-3 flex items-center gap-2 font-mono text-xs text-stone-300">
            <span id="np-cur" class="w-9 text-right">0:00</span>
            <input id="np-seek" type="range" min="0" max="0" step="1" value="0" disabled class="min-w-0 flex-1" aria-label="Song position">
            <span id="np-dur" class="w-9">0:00</span>
          </div>
          <div id="transport" class="mt-3 grid grid-cols-5 gap-2 text-sm font-semibold">
            <button data-action="restart" data-icon="restart" class="tap flex items-center justify-center rounded-xl bg-white/10 py-2.5 active:bg-white/25" title="Restart" aria-label="Restart"></button>
            <button data-action="seek_by" data-value="-10" data-icon="back" class="tap flex items-center justify-center gap-1 rounded-xl bg-white/10 py-2.5 active:bg-white/25" title="Back 10 s">10</button>
            <button id="btn-toggle" data-action="pause" data-icon="pause" class="tap btn-gold flex items-center justify-center rounded-xl py-2.5" title="Play / pause" aria-label="Play / pause"></button>
            <button data-action="seek_by" data-value="10" class="tap flex items-center justify-center gap-1 rounded-xl bg-white/10 py-2.5 active:bg-white/25" title="Forward 10 s">10<svg viewBox="0 0 24 24" class="h-5 w-5 fill-current"><path d="M13 6v12l8.5-6zM4 18l8.5-6L4 6z"/></svg></button>
            <button data-action="skip" data-icon="skip" class="tap flex items-center justify-center rounded-xl bg-white/10 py-2.5 active:bg-white/25" title="Skip" aria-label="Skip"></button>
          </div>
          <div id="nav-songs" class="mt-2.5 flex items-stretch gap-2 text-xs">
            <button id="remote-btn-prev" class="tap flex min-w-0 flex-1 items-center gap-1.5 rounded-xl bg-white/10 px-2.5 py-2 text-stone-200 transition hover:bg-white/20 active:bg-white/25 disabled:pointer-events-none disabled:opacity-30" title="Previous song">
              <svg viewBox="0 0 24 24" class="h-3.5 w-3.5 shrink-0 fill-current"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
              <span class="truncate font-semibold"><span class="font-normal text-stone-400">Prev: </span><span id="remote-prev-label">None</span></span>
            </button>
            <button id="remote-btn-next" class="tap flex min-w-0 flex-1 items-center justify-end gap-1.5 rounded-xl bg-white/10 px-2.5 py-2 text-stone-200 transition hover:bg-white/20 active:bg-white/25 disabled:pointer-events-none disabled:opacity-30" title="Next song">
              <span class="truncate text-right font-semibold"><span class="font-normal text-stone-400">Next: </span><span id="remote-next-label">Queue empty</span></span>
              <svg viewBox="0 0 24 24" class="h-3.5 w-3.5 shrink-0 fill-current"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg>
            </button>
          </div>
          <p id="transport-note" class="mt-3 hidden text-xs text-stone-400">Only the singer and the host can pause or skip this song.</p>
        </section>
        <div class="space-y-2 only-phone">
          <button type="button" data-open="search" class="btn-gold tap w-full rounded-xl py-3 text-base">＋ Find a song to sing</button>
          <button type="button" data-open="custom" class="tap w-full rounded-xl bg-white/10 border border-white/10 py-2.5 text-sm font-semibold text-stone-200 hover:bg-white/15">📁 Load custom song (file or link)</button>
        </div>
      </div>

      <!-- Queue: up next, with the my-songs filter and per-song controls (my-queue.js), then the Auto-DJ playlist -->
      <div data-view="queue" class="space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h2 class="text-sm font-semibold uppercase tracking-wider text-stone-400">Queue (<span id="queue-count">0</span>)</h2>
          <div id="queue-filter-pills" class="pill-row text-xs">
            <button id="qfilter-all" type="button" class="tap rounded-full px-3 py-1 font-bold transition">All</button>
            <button id="qfilter-mine" type="button" class="tap rounded-full px-3 py-1 font-bold transition">My songs (<span id="queue-mine-count">0</span>)</button>
            <button id="qfilter-played" type="button" class="tap rounded-full px-3 py-1 font-bold transition">Played (<span id="queue-played-count">0</span>)</button>
          </div>
        </div>
        <ul id="queue" class="space-y-2"></ul>
        <div id="queue-empty" class="panel space-y-3 p-6 text-center">
          <p id="empty-title" class="text-lg font-bold text-stone-200">Nobody in line</p>
          <p id="empty-sub" class="text-sm text-stone-400">Be the first to queue a song!</p>
          <div class="flex flex-wrap justify-center gap-2">
            <button type="button" data-open="search" class="btn-gold tap rounded-xl px-5 py-2.5 text-sm font-bold">＋ Find a song to sing</button>
            <button type="button" data-open="custom" class="tap rounded-xl bg-white/10 px-4 py-2.5 text-sm font-semibold text-stone-200 hover:bg-white/20">📁 Load custom song</button>
          </div>
        </div>
        <!-- Auto-DJ playlist queue below the singer queue (ui/autodj-box.js via my-queue.js) -->
        <div id="autodj-mount"></div>
      </div>

      <!-- Laptop only: ready songs right beside the queue (guest/app.js) -->
      <aside id="guest-side" class="guest-side panel p-4" aria-label="Ready songs"></aside>
    </main>

    <div id="support-footer" class="pb-4 pt-4 text-center">
      <a id="support-link" href="https://github.com/sponsors/abels-lab" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 rounded-full border border-amber-400/25 bg-amber-500/10 px-4 py-1.5 text-xs font-semibold text-gold transition hover:bg-amber-500/20">☕ Enjoying Karaoke Night? Buy a coffee</a>
    </div>
  </div>

  <!-- Phone: bottom tab bar, the big ＋ in the middle -->
  <nav class="tab-bar only-phone" aria-label="Sections">
    <button type="button" data-tab="now"><span class="tab-icon">🎤</span>Now</button>
    <button type="button" data-tab="queue"><span class="tab-icon">📋<span id="tab-queue-badge" class="tab-badge hidden"></span></span>Queue</button>
    <button type="button" data-open="search" class="tab-add btn-gold" aria-label="Find a song" title="Find a song">＋</button>
    <button type="button" data-open="lyrics" id="tab-lyrics"><span class="tab-icon">📖</span>Lyrics</button>
    <button type="button" data-open="settings"><span class="tab-icon">⚙</span>Settings</button>
  </nav>

  <script src="/static/common.js"></script>
  <script src="/static/ui/queue-rows.js"></script>
  <script src="/static/look.js"></script>
  <script src="/static/auth.js"></script>
  <script src="/static/lyrics.js"></script>
  <script src="/static/ui/popup.js"></script>
  <script src="/static/ui/confirm.js"></script>
  <script src="/static/ui/undo.js"></script>
  <script src="/static/ui/ready-songs.js"></script>
  <script src="/static/ui/song-rows.js"></script>
  <script src="/static/ui/custom-song-modal.js"></script>
  <script src="/static/ui/search-panel.js"></script>
  <script src="/static/ui/settings-rows.js"></script>
  <script src="/static/ui/party-panel.js"></script>
  <script src="/static/ui/sources-form.js"></script>
  <script src="/static/ui/sources-panel.js"></script>
  <script src="/static/ui/settings-panel.js"></script>
  <script src="/static/ui/library-card.js"></script>
  <script src="/static/ui/library-panel.js"></script>
  <script src="/static/ui/playlist-form.js"></script>
  <script src="/static/ui/playlists-panel.js"></script>
  <script src="/static/ui/autodj-box.js"></script>
  <script src="/static/remote-battle.js"></script>
  <script src="/static/guest/overlay-back.js"></script>
  <script src="/static/guest/router.js"></script>
  <script src="/static/guest/prefs.js"></script>
  <script src="/static/guest/display.js"></script>
  <script src="/static/guest/fullscreen.js"></script>
  <script src="/static/my-queue.js"></script>
  <script src="/static/remote-login.js"></script>
  <script src="/static/guest/now-bar.js"></script>
  <script src="/static/remote.js"></script>
  <script src="/static/guest/settings-popup.js"></script>
  <script src="/static/agent-render.js"></script>
  <script src="/static/guest/copilot.js"></script>
  <script src="/static/guest/app.js"></script>
</body>
</html>
