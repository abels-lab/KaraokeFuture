<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0705">
  <title>Karaoke Remote</title>
  <link rel="icon" href="/static/img/microphone.png">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap">
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body class="antialiased">
  <div class="mx-auto max-w-lg space-y-4 px-4 pb-24 pt-4">
    <header class="flex items-center gap-3">
      <img src="/static/img/microphone.png" alt="" class="mic-glow h-10 w-auto -rotate-12">
      <h1 class="font-display flex-1 text-2xl font-black text-gold">Karaoke Night</h1>
      <a href="/library" class="rounded-lg bg-white/10 px-3 py-1.5 text-sm font-semibold">📚 Library</a>
    </header>

    <!-- Now playing + transport -->
    <section class="panel p-4">
      <p class="text-xs font-semibold uppercase tracking-[0.3em] text-gold">Now singing</p>
      <p id="np-singer" class="font-display mt-1 text-2xl font-bold">Nobody yet</p>
      <p id="np-title" class="truncate text-sm text-stone-300">Add a song to get started</p>
      <button id="np-lyrics" class="mt-2 hidden rounded-lg bg-amber-900/60 px-3 py-1.5 text-xs font-semibold">📝 Lyrics wrong? Fix them</button>
      <div class="mt-3 flex items-center gap-2 font-mono text-xs text-stone-300">
        <span id="np-cur" class="w-9 text-right">0:00</span>
        <input id="np-seek" type="range" min="0" max="0" step="1" value="0" disabled class="flex-1">
        <span id="np-dur" class="w-9">0:00</span>
      </div>
      <div class="mt-3 grid grid-cols-5 gap-2 text-sm font-semibold">
        <button data-action="restart" data-icon="restart" class="flex justify-center rounded-xl bg-white/10 py-2.5 active:bg-white/25" title="Restart"></button>
        <button data-action="seek_by" data-value="-10" data-icon="back" class="flex items-center justify-center gap-1 rounded-xl bg-white/10 py-2.5 active:bg-white/25" title="Back 10 s">10</button>
        <button id="btn-toggle" data-action="pause" data-icon="pause" class="btn-gold flex justify-center rounded-xl py-2.5" title="Play / pause"></button>
        <button data-action="seek_by" data-value="10" class="flex items-center justify-center gap-1 rounded-xl bg-white/10 py-2.5 active:bg-white/25" title="Forward 10 s">10<svg viewBox="0 0 24 24" class="h-5 w-5 fill-current"><path d="M13 6v12l8.5-6zM4 18l8.5-6L4 6z"/></svg></button>
        <button data-action="skip" data-icon="skip" class="flex justify-center rounded-xl bg-white/10 py-2.5 active:bg-white/25" title="Skip"></button>
      </div>
    </section>

    <!-- Singer name -->
    <label class="block">
      <span class="text-sm font-semibold text-stone-300">Your singer name</span>
      <input id="singer" maxlength="32" autocomplete="nickname" placeholder="e.g. Freddie"
             class="mt-1 w-full rounded-xl border border-white/10 bg-black/50 px-4 py-3 text-lg outline-none focus:border-amber-400">
    </label>

    <!-- Search -->
    <form id="search-form" class="flex gap-2">
      <input id="query" type="search" maxlength="120" placeholder="Search song or artist…" enterkeyhint="search"
             class="min-w-0 flex-1 rounded-xl border border-white/10 bg-black/50 px-4 py-3 outline-none focus:border-amber-400">
      <button id="search-btn" class="btn-gold rounded-xl px-5">Search</button>
    </form>

    <section>
      <h2 id="results-title" class="mb-2 text-sm font-semibold uppercase tracking-wider text-stone-400"></h2>
      <ul id="results" class="space-y-2"></ul>
    </section>

    <!-- Queue -->
    <section>
      <h2 class="mb-2 text-sm font-semibold uppercase tracking-wider text-stone-400">
        Up next (<span id="queue-count">0</span>)
      </h2>
      <ul id="queue" class="space-y-2"></ul>
      <p id="queue-empty" class="text-sm text-stone-400">Nobody in line — be the first!</p>
    </section>
  </div>

  <script src="/static/common.js"></script>
  <script src="/static/lyrics.js"></script>
  <script src="/static/remote.js"></script>
</body>
</html>
